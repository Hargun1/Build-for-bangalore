# Render Blueprint: two free web services.
#   pranexusai     Node API that also serves the built React app (one URL, no CORS)
#   pranexusai-ai  Python health-intelligence service, called only by the Node API
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Then fill in the
# variables marked "sync: false" (Render asks for them on the first deploy).
# Free instances sleep after 15 minutes idle; the first request after that takes ~1 minute.

services:
  - type: web
    name: pranexusai
    runtime: node
    plan: free
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: AI_INTERNAL_TOKEN
        fromService:
          type: web
          name: pranexusai-ai
          envVarKey: AI_INTERNAL_TOKEN
      # Public URL of the AI service, e.g. https://pranexusai-ai.onrender.com
      - key: AI_SERVICE_URL
        sync: false
      # MongoDB Atlas free M0 connection string
      - key: MONGODB_URI
        sync: false
      # This service's own URL, e.g. https://pranexusai.onrender.com
      - key: CLIENT_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Same value as GOOGLE_CLIENT_ID; read by the React build
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: pranexusai-ai
    runtime: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AI_INTERNAL_TOKEN
        generateValue: true
      # At least one of these (all have free tiers)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
