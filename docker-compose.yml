# Whole stack locally: docker compose up --build, then open http://localhost:5001
# Put your AI key(s) in ai-service/.env (see ai-service/.env.example).
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  ai:
    build: ./ai-service
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      AI_INTERNAL_TOKEN: local-dev-token

  app:
    build: .
    ports:
      - "5001:5001"
    environment:
      MONGODB_URI: mongodb://mongo:27017/pranexusai
      AI_SERVICE_URL: http://ai:8000
      AI_INTERNAL_TOKEN: local-dev-token
      JWT_SECRET: local-dev-secret-change-me-0123456789
      CLIENT_URL: http://localhost:5001
    env_file:
      - path: ./server/.env
        required: false
    depends_on:
      - mongo
      - ai

volumes:
  mongo_data:
